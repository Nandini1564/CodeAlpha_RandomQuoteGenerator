<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Random Quote Generator</title>
   <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <div class="container">
    <h1>✨ Random Quote Generator ✨</h1>

    <div class="quote-box">
      <p id="quote">Click the button to generate a quote.</p>
      <h3 id="author"></h3>
       <p id="counter"></p>
    </div>

    <div class="buttons">
  <button id="prev-quote">Previous Quote</button>
  <button id="new-quote">New Quote</button>
  <button id="copy-quote">Copy Quote</button>
  <button id="favorite">❤️ Favorite</button>
  <button id="share-quote">Share Quote</button>
</div>
  </div>
   <footer>
    <p>Presented by Nandini 💜</p>
  </footer>


  <script src="script.js"></script>
</body>
</html>
